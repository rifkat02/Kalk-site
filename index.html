​const calculators = [
{
id: 'puttiness',
name: 'Шпаклёвка',
icon: 'layers',
desc: 'Расчёт расхода шпаклёвки по типу смеси и площади',
fields: [
{ id: 'type', label: 'Вид шпаклёвки', type: 'select', options: [
{ label: 'Финишная (1.2 кг/м²/мм)', value: 1.2 },
{ label: 'Стартовая (1.5 кг/м²/мм)', value: 1.5 },
{ label: 'Штукатурная (1.0 кг/м²/мм)', value: 1.0 },
{ label: 'Суперфиниш (1.1 кг/м²/мм)', value: 1.1 }
]},
{ id: 'area', label: 'Площадь стен (м²)', type: 'number', value: 25 },
{ id: 'thick', label: 'Толщина слоя (мм)', type: 'number', value: 2 },
{ id: 'bag', label: 'Вес мешка (кг)', type: 'number', value: 20 }
],
calc: (v) => {
const totalKg = v.area * v.type * v.thick;
const bags = Math.ceil(totalKg / (v.bag || 1));
return { totalKg: totalKg.toFixed(1), bags };
},
renderResult: (r) => <p class="font-bold text-base">Результат расчёта:</p> <p class="text-sm">Общий вес: <strong class="text-amber-500">${r.totalKg} кг</strong></p> <p class="text-sm">Потребуется мешков: <strong class="text-amber-500 text-lg">${r.bags} шт.</strong></p>
},
{
id: 'wallpaper',
name: 'Обои по стенам',
icon: 'grid',
desc: 'Расчёт рулонов обоев с учётом окон и дверей',
fields: [
{ id: 'length', label: 'Длина комнаты (м)', type: 'number', value: 5 },
{ id: 'width', label: 'Ширина комнаты (м)', type: 'number', value: 4 },
{ id: 'height', label: 'Высота потолка (м)', type: 'number', value: 2.7 },
{ id: 'rollSize', label: 'Размер рулона', type: 'select', options: [
{ label: '0.53 м х 10.05 м', value: '0.53_10' },
{ label: '1.06 м х 10.05 м (Евро)', value: '1.06_10' },
{ label: '1.06 м х 25 м', value: '1.06_25' }
]},
{ id: 'deductions', label: 'Вычет окон и дверей (м²)', type: 'number', value: 6 },
{ id: 'repeat', label: 'Раппорт/подгонка рисунка (см)', type: 'number', value: 0 }
],
calc: (v) => {
const perimeter = (v.length + v.width) * 2;
const wallArea = perimeter * v.height - v.deductions;
let rollW = 0.53, rollL = 10;
if (v.rollSize === '1.06_10') { rollW = 1.06; rollL = 10; }
if (v.rollSize === '1.06_25') { rollW = 1.06; rollL = 25; }
​const singleStripLen = v.height + (v.repeat / 100);
const stripsPerRoll = Math.floor(rollL / singleStripLen);
const totalStripsNeeded = Math.ceil(perimeter / rollW);
const rollsNeeded = Math.ceil(totalStripsNeeded / (stripsPerRoll || 1));
​return { wallArea: wallArea.toFixed(1), rollsNeeded, totalStripsNeeded };
},
renderResult: (r) => <p class="font-bold text-base">Результат расчёта:</p> <p class="text-sm">Площадь оклейки: <strong class="text-amber-500">${r.wallArea} м²</strong></p> <p class="text-sm">Всего полос: <strong class="text-amber-500">${r.totalStripsNeeded} шт.</strong></p> <p class="text-sm">Потребуется рулонов: <strong class="text-amber-500 text-lg">${r.rollsNeeded} шт.</strong></p>
},
{
id: 'paint',
name: 'Краска (все виды)',
icon: 'paint-bucket',
desc: 'Расчёт краски для всех видов поверхностей и составов',
fields: [
{ id: 'type', label: 'Тип краски', type: 'select', options: [
{ label: 'Водоэмульсионная (120 мл/м²)', value: 120 },
{ label: 'Акриловая (150 мл/м²)', value: 150 },
{ label: 'Латексная (110 мл/м²)', value: 110 },
{ label: 'Силиконовая (140 мл/м²)', value: 140 },
{ label: 'Эмаль НЦ/ПФ (160 мл/м²)', value: 160 },
{ label: 'Фасадная (180 мл/м²)', value: 180 }
]},
{ id: 'area', label: 'Площадь окраски (м²)', type: 'number', value: 40 },
{ id: 'layers', label: 'Количество слоёв', type: 'number', value: 2 },
{ id: 'margin', label: 'Запас (%)', type: 'number', value: 10 }
],
calc: (v) => {
const totalLiters = (v.area * v.type * v.layers * (1 + v.margin / 100)) / 1000;
return { liters: totalLiters.toFixed(2) };
},
renderResult: (r) => <p class="font-bold text-base">Результат расчёта:</p> <p class="text-sm">Необходимый объём: <strong class="text-amber-500 text-lg">${r.liters} л</strong></p>
},
{
id: 'collering',
name: 'Колеровка',
icon: 'palette',
desc: 'Расчёт колер-пасты для всех типов смесей',
fields: [
{ id: 'mixType', label: 'Вид колеруемой смеси', type: 'select', options: [
{ label: 'Водоэмульсионная краска', value: 'paint' },
{ label: 'Декоративная штукатурка', value: 'stucco' },
{ label: 'Акриловая шпаклёвка', value: 'putty' },
{ label: 'Лаки и эмали', value: 'varnish' }
]},
{ id: 'volume', label: 'Объём основной базы (л/кг)', type: 'number', value: 10 },
{ id: 'intensity', label: 'Насыщенность тона', type: 'select', options: [
{ label: 'Пастельный (1% колера)', value: 0.01 },
{ label: 'Средний тон (3% колера)', value: 0.03 },
{ label: 'Насыщенный (5% колера)', value: 0.05 },
{ label: 'Яркий/Ядовитый (10% колера)', value: 0.10 }
]}
],
calc: (v) => {
const colorantMl = v.volume * v.intensity * 1000;
return { colorantMl: colorantMl.toFixed(0) };
},
renderResult: (r) => <p class="font-bold text-base">Результат колеровки:</p> <p class="text-sm">Объём колер-пасты: <strong class="text-amber-500 text-lg">${r.colorantMl} мл</strong></p>
},
{
id: 'concrete-sand',
name: 'Цемент и песок',
icon: 'box',
desc: 'Расчёт компонентов раствора по марке цемента',
fields: [
{ id: 'mark', label: 'Марка цемента / раствора', type: 'select', options: [
{ label: 'Раствор М75 (Цемент М400 + 4.5 песка)', value: 'M75' },
{ label: 'Раствор М100 (Цемент М400 + 3.5 песка)', value: 'M100' },
{ label: 'Раствор М150 (Цемент М400 + 2.8 песка)', value: 'M150' },

​function renderCalculator(id) {
const container = document.getElementById('contentContainer');
const calc = calculators.find(c => c.id === id) || calculators[0];
​if (!calc) return;
​let fieldsHtml = calc.fields.map(f => {
if (f.type === 'select') {
const optionsHtml = f.options.map(o => <option value="${o.value}">${o.label}</option>).join('');
return <div> <label class="block text-xs font-semibold mb-1">${f.label}</label> <select id="field_${f.id}" class="w-full bg-gray-50 dark:bg-navy-800 border border-gray-300 dark:border-navy-700 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"> ${optionsHtml} </select> </div>;
}
return <div> <label class="block text-xs font-semibold mb-1">${f.label}</label> <input type="${f.type || 'number'}" id="field_${f.id}" value="${f.value}" class="w-full bg-gray-50 dark:bg-navy-800 border border-gray-300 dark:border-navy-700 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"> </div>;

lucide.createIcons();
}
​function executeCalculation(id) {
const calc = calculators.find(c => c.id === id);
if (!calc) return;
​const fieldValues = {};
calc.fields.forEach(f => {
const el = document.getElementById(field_${f.id});
let val = el.value;
if (f.type !== 'select' || !isNaN(parseFloat(val))) {
val = parseFloat(val) || 0;
}
fieldValues[f.id] = val;
});
​try {
const res = calc.calc(fieldValues);
const resDiv = document.getElementById('calcResult');
resDiv.classList.remove('hidden');
resDiv.innerHTML = calc.renderResult(res);
} catch(e) {
console.error(e);
}
}
